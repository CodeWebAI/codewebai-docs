<header class="site-header">
	<div class="header-inner">
		<a class="brand" href="{{ nav.homepage.url | url }}" aria-label="{{ config.site_name }}">
			{% if config.theme.logo %}<img class="brand-logo" src="{{ config.theme.logo | url }}" alt="">{% endif %}
			<span>{{ config.site_name }}</span>
		</a>
		<nav class="desktop-nav" aria-label="Navegación principal">
			{% for nav_item in nav %}
				{% if nav_item.children %}
					<a class="nav-link{% if nav_item.active %} is-active{% endif %}" href="{{ nav_item.children[0].url | url }}">{{ nav_item.title }}</a>
				{% else %}
					<a class="nav-link{% if nav_item.active %} is-active{% endif %}" href="{{ nav_item.url | url }}">{{ nav_item.title }}</a>
				{% endif %}
			{% endfor %}
		</nav>
		<div class="header-actions">
			<div class="user-auth-slot" id="user-auth-slot" aria-live="polite">
				<div class="user-auth-badge" id="user-auth-badge">
					<span class="user-email" title="Sesión activa">Cuenta</span>
					<button type="button" id="logout-btn" class="logout-btn" title="Cerrar sesión">Salir</button>
				</div>
			</div>
			<button class="icon-button" type="button" id="theme-toggle" aria-label="Cambiar tema"
				title="Cambiar tema"><span aria-hidden="true">◐</span></button>
			{% if config.repo_url %}<a class="github-link" href="{{ config.repo_url }}" target="_blank" rel="noopener"
				aria-label="Abrir repositorio en GitHub" title="Repositorio en GitHub">GitHub</a>{% endif %}
			<button class="icon-button menu-toggle" type="button" id="menu-toggle" aria-label="Abrir menú"
				aria-expanded="false"><span aria-hidden="true">☰</span></button>
		</div>
	</div>
</header>
<script>
	(function () {
		const email = sessionStorage.getItem('codewebai-user-email');
		const userEmail = document.querySelector('.user-email');
		if (email && userEmail) {
			userEmail.title = email;
			userEmail.textContent = email;
		}
	}());
</script>
